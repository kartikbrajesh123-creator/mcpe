                    if(selectedSlots.length === 0) return Modal.warning('Please select at least one slot.');
                    const totalCost = selectedSlots.length * parseFloat(data.entryFee || 0);
                    if(userProfile.balance < totalCost) {
                        Modal.error('Insufficient Balance for ' + selectedSlots.length + ' slots.');
                        return showSection('wallet-section');
                    }
                    showSection('player-details-section', { ...data, selectedSlots: selectedSlots });
                });
            }
            if(sectionId === 'player-details-section') {
                renderPlayerDetails(data);
                safeClick('btnConfirmJoin', async () => {
                    const inputs = document.querySelectorAll('.details-input');
                    let isValid = true;
                    const participantsData = {};
                    inputs.forEach(input => {
                        if(!input.value.trim()) isValid = false;
                        const slot = input.getAttribute('data-slot');
                        if(!participantsData[slot]) participantsData[slot] = {};
                        participantsData[slot]['ign'] = input.value.trim();
                    });
                    if(!isValid) return Modal.warning('Please fill all player details.');
                    const totalCost = data.selectedSlots.length * parseFloat(data.entryFee || 0);
                    showLoader(true);
                    try {
                        const userBalRef = ref(db, `users/${currentUser.uid}/balance`);
                        const result = await runTransaction(userBalRef, (currentBal) => {
                            if (currentBal === null) return 0;
                            if (currentBal >= totalCost) return currentBal - totalCost;
                            return;
                        });
                        if (result.committed) {
                            await logTransaction(currentUser.uid, totalCost, 'debit', `Joined Match: Slot ${data.selectedSlots.join(',')}`);
                            const updates = {};
                            data.selectedSlots.forEach(slotNum => {
                                const pData = participantsData[slotNum] || {};
                                updates[`tournaments/${data.id}/participants/${slotNum}`] = {
                                    userId: currentUser.uid,
                                    inGameName: pData.ign || 'Player',
                                    slot: slotNum,
                                    joinedAt: serverTimestamp()
                                };
                            });
                            const newFilledCount = (data.filledSlots || 0) + data.selectedSlots.length;
                            updates[`tournaments/${data.id}/filledSlots`] = newFilledCount;
                            await update(ref(db), updates);
                            showLoader(false);
                            await Modal.success('You have successfully joined the match!', 'Joined!');
                            showSection('history-section');
                        } else {
                            showLoader(false);
                            Modal.error('Insufficient Balance or Transaction Failed.');
                        }
                    } catch (e) {
                        console.error(e);
                        showLoader(false);
                        Modal.error('Error joining match: ' + e.message);
                    }
                });
            }
            if(sectionId === 'wallet-section') {
                safeClick('addMoneyBtn', () => { window.location.href = 'addfund.html'; });
                safeClick('withdrawBtn', () => showSection('withdraw-section'));
            }
            if(sectionId === 'withdraw-section') {
                safeClick('submitWithdrawBtn', async () => {
                    const amount = parseFloat(getElement('withdrawAmount').value);
                    const upi = getElement('withdrawUpi').value.trim();
                    if(!amount || amount < 50) return Modal.warning('Minimum withdrawal is ₹50.');
                    if(!upi) return Modal.warning('Please enter a valid UPI ID.');
                    
                    // ✅ FIX: Check withdrawable balance based on mode
                    const totalBal = parseFloat(userProfile.balance || 0);
                    const winBal = parseFloat(userProfile.winningBalance || 0);
                    const withdrawable = WITHDRAW_MODE === 'winning' ? winBal : totalBal;
                    
                    if(amount > withdrawable) {
                        return Modal.warning(`You can withdraw up to ₹${withdrawable.toFixed(2)} only.`);
                    }
                    
                    showLoader(true);
                    try {
                        if (WITHDRAW_MODE === 'winning') {
                            // ✅ FIX: Deduct from BOTH winningBalance AND balance
                            const winRef = ref(db, `users/${currentUser.uid}/winningBalance`);
                            const winResult = await runTransaction(winRef, (currentBal) => {
                                if (currentBal === null) return 0;
                                if (currentBal >= amount) return currentBal - amount;
                                return;
                            });
                            
                            if (winResult.committed) {
                                // Deduct from main balance too
                                const balRef = ref(db, `users/${currentUser.uid}/balance`);
                                await runTransaction(balRef, (currentBal) => {
                                    if (currentBal === null) return 0;
                                    if (currentBal >= amount) return currentBal - amount;
                                    return;
                                });
                                
                                await push(ref(db, 'withdrawals'), { 
                                    userId: currentUser.uid, 
                                    amount: amount, 
                                    upi: upi, 
                                    status: 'pending', 
                                    timestamp: serverTimestamp() 
                                });
                                await logTransaction(currentUser.uid, amount, 'debit', 'Withdrawal Request (Winnings)');
                                await Modal.success('Withdrawal Request Submitted Successfully!', 'Submitted');
                                showSection('wallet-section');
                            } else {
                                Modal.error('Insufficient Winning Balance.');
                            }
                        } else {
                            // WITHDRAW_MODE === 'total' - deduct from balance only
                            const userRef = ref(db, `users/${currentUser.uid}/balance`);
                            const result = await runTransaction(userRef, (currentBal) => {
                                if (currentBal === null) return 0;
                                if (currentBal >= amount) return currentBal - amount;
                                return;
                            });
                            if (result.committed) {
                                // Also try to reduce winningBalance proportionally (optional)
                                await push(ref(db, 'withdrawals'), { 
                                    userId: currentUser.uid, 
                                    amount: amount, 
                                    upi: upi, 
                                    status: 'pending', 
                                    timestamp: serverTimestamp() 
                                });
                                await logTransaction(currentUser.uid, amount, 'debit', 'Withdrawal Request');
                                await Modal.success('Withdrawal Request Submitted Successfully!', 'Submitted');
                                showSection('wallet-section');
                            } else {
                                Modal.error('Insufficient Balance.');
                            }
                        }
                        showLoader(false);
                    } catch (err) {
                        console.error(err);
                        Modal.error('Error processing withdrawal.');
                        showLoader(false);
                    }
                });
            }
            if(sectionId === 'support-section') {
                const links = supportLinks || {};
                const open = (url) => {
                    if(url) window.open(url, '_blank');
                    else Modal.warning('This link is not set by admin yet.');
                };
                safeClick('btnSupportWhatsapp', () => open(links.whatsapp));
                safeClick('btnSupportTelegram', () => open(links.telegram));
                safeClick('btnSupportInstagram', () => open(links.instagram));
                safeClick('btnSupportYoutube', () => open(links.youtube));
                safeClick('btnSupportEmail', () => open(links.email));
                safeClick('btnSupportWebsite', () => open(links.website));
            }
            if(sectionId === 'privacy-policy-section') loadPrivacyPolicy();
        }

        // ==========================================
        // INIT
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            if(!auth) return;
            showLoader(true);
            document.querySelectorAll('.nav-item').forEach(i => i.addEventListener('click', (e) => { e.preventDefault(); showSection(i.dataset.section); }));
            safeClick('navHomeFab', () => showSection('home-section'));
            safeClick('headerWalletChip', (e) => { e.preventDefault(); showSection('wallet-section'); });
            safeClick('headerBackBtn', () => {
                const currentSection = document.querySelector('.section.active').id;
                if(currentSection === 'withdraw-section') showSection('wallet-section');
                else if(currentSection === 'privacy-policy-section') showSection('profile-section');
                else if(currentSection === 'slot-selection-section') showSection('home-section');
                else if(currentSection === 'player-details-section') showSection('home-section');
                else if(currentSection === 'match-result-section') showSection('home-section');
                else showSection('home-section');
            });
            await loadAppSettings();
            onAuthStateChanged(auth, handleAuthStateChange);
        });
    </script>
</body>
</html>
